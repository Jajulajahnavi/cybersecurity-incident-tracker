<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Incident | Cybersecurity Incident Tracker</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header Navigation -->
    <nav class="navbar">
        <a href="index.html" class="nav-brand">
            <span class="shield-icon">🛡️</span>
            <span>IncidentTracker</span>
        </a>
        <div class="nav-right-container">
            <ul class="nav-links">
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="report.html" class="active">Report Incident</a></li>
                <li><a href="incidents.html">Incident Logs</a></li>
            </ul>
            <div class="soc-status-badge">
                <span class="pulse-dot"></span>
                <span>SOC ACTIVE</span>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="container">
        <div class="page-header">
            <div>
                <h1>Report Security Incident</h1>
                <p>Submit security threats, suspected breaches, or anomalous activity for SOC review</p>
            </div>
            <div>
                <a href="index.html" class="btn btn-outline">&larr; Back to Dashboard</a>
            </div>
        </div>

        <div class="form-card">
            <!-- Alert message container -->
            <div id="alertBox" style="display: none; padding: 1rem; border-radius: 6px; margin-bottom: 1.5rem; font-size: 0.95rem;"></div>

            <form id="incidentForm">
                <div class="form-group">
                    <label for="title">Incident Title *</label>
                    <input type="text" id="title" class="form-control" placeholder="e.g. Unusual Outbound Traffic on Database Server" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="incidentType">Incident Type *</label>
                        <select id="incidentType" class="form-control" required>
                            <option value="">-- Select Threat Category --</option>
                            <option value="Phishing">Phishing / Social Engineering</option>
                            <option value="Malware">Malware Infection</option>
                            <option value="Ransomware">Ransomware Activity</option>
                            <option value="Unauthorized Access">Unauthorized Access / Brute Force</option>
                            <option value="DDoS">Denial of Service (DoS / DDoS)</option>
                            <option value="Data Leak">Data Exfiltration / Leak</option>
                            <option value="Insider Threat">Insider Threat</option>
                            <option value="Misconfiguration">Security Misconfiguration</option>
                            <option value="Other">Other Security Event</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="severity">Severity Level *</label>
                        <select id="severity" class="form-control" required>
                            <option value="LOW">Low (Informational / Minor deviation)</option>
                            <option value="MEDIUM" selected>Medium (Standard impact / Contained)</option>
                            <option value="HIGH">High (Active threat / Critical asset)</option>
                            <option value="CRITICAL">Critical (Severe outage / Data compromise)</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="affectedSystem">Affected System / Asset *</label>
                        <input type="text" id="affectedSystem" class="form-control" placeholder="e.g. Web-Prod-01, ERP Database, Employee Laptop" required>
                    </div>

                    <div class="form-group">
                        <label for="reportedBy">Reported By (Name / Staff ID) *</label>
                        <input type="text" id="reportedBy" class="form-control" placeholder="e.g. Alex Mercer (Security Analyst)" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="incidentDate">Incident Detection Date & Time *</label>
                    <input type="datetime-local" id="incidentDate" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="description">Detailed Incident Description *</label>
                    <textarea id="description" class="form-control" rows="5" placeholder="Provide observed symptoms, error logs, affected IP addresses, and immediate containment measures taken..." required></textarea>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem;">
                    <button type="reset" class="btn btn-outline">Reset Form</button>
                    <button type="submit" id="submitBtn" class="btn btn-primary">Submit Incident Report</button>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>Cybersecurity Incident Reporting and Response Tracker | College PBL Project</p>
    </footer>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/report.js"></script>
</body>
</html>
